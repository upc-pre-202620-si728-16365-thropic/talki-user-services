server:
  port: ${PORT:8081}

spring:
  datasource:
    url: jdbc:h2:mem:identitydb
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:guest}
    password: ${RABBITMQ_PASSWORD:guest}
    virtual-host: ${RABBITMQ_VHOST:/}

jwt:
  # Sin fallback (SB1-07-D): si falta JWT_SECRET el servicio falla al arrancar.
  secret: ${JWT_SECRET}

internal:
  # Sin fallback (US33): clave de la compuerta /internal; si falta, falla al arrancar.
  api-key: ${INTERNAL_API_KEY}
  access-ttl-minutes: ${JWT_ACCESS_TTL_MINUTES:15}
  refresh-ttl-days: ${REFRESH_TTL_DAYS:7}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha
